name: Pubblica su Instagram

on:
  schedule:
    # ogni 10 minuti (orari UTC); GitHub può partire con qualche minuto di ritardo
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      solo_id:
        description: "Pubblica subito un post preciso (es. cd-001). Vuoto = segue il calendario"
        required: false
        default: ""
      prova:
        description: "Prova senza pubblicare"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pubblica-instagram
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pubblica i post in orario
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SOLO_ID: ${{ inputs.solo_id }}
          PROVA: ${{ inputs.prova }}
        run: python scripts/pubblica.py
      - name: Salva il registro dei pubblicati
        if: always()
        run: |
          if ! git diff --quiet pubblicati.json; then
            git config user.name "creative-digital-bot"
            git config user.email "actions@users.noreply.github.com"
            git add pubblicati.json
            git commit -m "Registro pubblicazioni aggiornato"
            git pull --rebase
            git push
          fi
